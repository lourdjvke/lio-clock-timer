<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lio HUD Widget</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
    body { background: #FFFFFF; color: #111827; padding: 14px; user-select: none; }
    .widget-box { background: #F4F4F5; border: 1px solid rgba(0,0,0,0.08); border-radius: 20px; padding: 12px 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .brand { font-size: 11px; font-weight: 800; letter-spacing: 0.5px; color: #71717A; display: flex; align-items: center; gap: 6px; }
    .close-btn { background: none; border: none; font-size: 14px; cursor: pointer; color: #71717A; }
    .clock-row { font-size: 32px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; color: #09090B; }
    .status-row { font-size: 11px; font-weight: 700; color: #71717A; margin-top: 4px; }
    .bar { width: 100%; height: 5px; background: rgba(0,0,0,0.08); border-radius: 999px; margin-top: 8px; overflow: hidden; }
    .fill { height: 100%; background: #09090B; border-radius: 999px; width: 100%; }
    .actions { display: flex; gap: 6px; margin-top: 10px; }
    .act-btn { flex: 1; padding: 6px 10px; font-size: 11px; font-weight: 700; border-radius: 999px; border: none; background: #09090B; color: #FFF; cursor: pointer; }
  </style>
</head>
<body>
  <div class="widget-box">
    <div class="header">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>LIO HUD WIDGET</span>
      </div>
      <button class="close-btn" onclick="if(window.android?.closeFloating) window.android.closeFloating('widget.html')">✕</button>
    </div>
    <div class="clock-row" id="wClock">12:45</div>
    <div class="status-row" id="wStatus">FOCUS TIMER • 25:00</div>
    <div class="bar"><div class="fill" id="wFill" style="width: 100%"></div></div>
    <div class="actions">
      <button class="act-btn" onclick="toggleTimer()">Toggle Timer</button>
      <button class="act-btn" style="background:#E4E4E7; color:#09090B;" onclick="if(window.android?.activate) window.android.activate()">Open Lio</button>
    </div>
  </div>
  <script>
    function updateW() {
      const now = new Date();
      let h = now.getHours() % 12 || 12;
      document.getElementById('wClock').textContent = String(h).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
    }
    setInterval(updateW, 1000);
    updateW();
    function toggleTimer() {
      if (window.android?.vibrate) window.android.vibrate([0, 50]);
    }
  </script>
</body>
</html>

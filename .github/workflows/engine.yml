name: Remote Android APK Compiler

on:
  repository_dispatch:
    types: [build_apk_engine]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Template
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject Web Bundle & App Specs
        run: |
          mkdir -p app/src/main/assets
          if [ "${{ github.event.client_payload.web_assets_zip }}" != "" ]; then
            echo "${{ github.event.client_payload.web_assets_zip }}" | base64 -d > assets.zip
            unzip -o assets.zip -d app/src/main/assets/
          fi
          echo '${{ github.event.client_payload.widget_config }}' > app/src/main/assets/app.widget.json
          echo '${{ github.event.client_payload.notification_config }}' > app/src/main/assets/notification_config.json

      - name: Compile APK via Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lio-apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
